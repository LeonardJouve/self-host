{{- if .Values.auth.apiKeys }}
{{- /*
crw's AuthConfig accepts a TOML array or a comma-separated string
(crates/crw-core/src/config.rs auth_config_api_keys_from_comma_string), so the
list is joined here and read via the CRW_AUTH__API_KEYS env var — env beats
every config file in the load order.

Keep apiKeys out of Git: pass --set-file / --set at install time, or use an
external secret operator.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: crw-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app: crw
type: Opaque
stringData:
  apiKeys: {{ join "," .Values.auth.apiKeys | quote }}
{{- end }}
